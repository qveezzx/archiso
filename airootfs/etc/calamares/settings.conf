---
modules-search: [ /usr/share/calamares/modules, local ]

instances:
- id:       packages
  module:   packages
  config:   packages.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages@packages
  - umount
- show:
  - finished

branding: default
prompt-install: true
dont-chroot: false
show-back-button: true
show-next-button: true

[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel = Never
LocalFileSigLevel = Never
IgnorePkg = systemd systemd-libs bash glibc

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/x86_64/$repo

[chaotic-aur]
SigLevel = Optional TrustAll
Server = https://cdn-mirror.chaotic.cx/chaotic-aur/$arch

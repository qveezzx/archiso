[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel = Never
LocalFileSigLevel = Never

# Tell pacman NOT to install the default Calamares configs 
          # so your local ones can exist in peace.
          sed -i '/\[options\]/a NoExtract = etc/calamares/modules/*' custom-profile/pacman.conf
# REMOVE the IgnorePkg line completely. It causes the dependency errors you see.

# 1. ARCH CORE FIRST (Maximum compatibility)
[core]
Include = /etc/pacman.d/mirrorlist

# 2. ARCH EXTRA
[extra]
Include = /etc/pacman.d/mirrorlist

# 3. CACHYOS LAST (Only for the kernel and specific tools)
[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/x86_64/cachyos

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
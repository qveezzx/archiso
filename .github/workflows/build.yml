name: Build ISO

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: 
      image: archlinux:latest
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # 1. Setup Repos on host (using SigLevel=Never to avoid interactive key prompts in CI)
          echo -e "\n[chaotic-aur]\nSigLevel = Never\nServer = https://cdn-mirror.chaotic.cx/chaotic-aur/\$arch" >> /etc/pacman.conf
          echo -e "\n[arcolinux_repo]\nSigLevel = Never\nServer = https://arcolinux.github.io/arcolinux_repo/\$arch" >> /etc/pacman.conf
          echo -e "\n[arcolinux_repo_3party]\nSigLevel = Never\nServer = https://arcolinux.github.io/arcolinux_repo_3party/\$arch" >> /etc/pacman.conf
          echo -e "\n[endeavouros]\nSigLevel = Never\nServer = https://mirrors.tuna.tsinghua.edu.cn/endeavouros/repo/endeavouros/\$arch" >> /etc/pacman.conf
          echo -e "\n[cachyos]\nSigLevel = Never\nServer = https://mirror.cachyos.org/repo/\$arch/\$repo" >> /etc/pacman.conf
          echo -e "\n[cachyos-v4]\nSigLevel = Never\nServer = https://mirror.cachyos.org/repo/x86_64_v4/\$repo" >> /etc/pacman.conf
          echo -e "\n[cachyos-core-v4]\nSigLevel = Never\nServer = https://mirror.cachyos.org/repo/x86_64_v4/\$repo" >> /etc/pacman.conf
          echo -e "\n[cachyos-extra-v4]\nSigLevel = Never\nServer = https://mirror.cachyos.org/repo/x86_64_v4/\$repo" >> /etc/pacman.conf
          
          # 2. Update and install archiso
          pacman -Syu --noconfirm archiso

      - name: Prepare Custom Profile
        run: |
          # 1. Copy the official Arch 'releng' profile
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # 2. Change the ISO name and version (format: zuccos-YYMMDD)
          Z_DATE=$(date +%y%m%d)
          echo "Z_DATE=$Z_DATE" >> $GITHUB_ENV
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"zuccos\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_version=\".*\"/iso_version=\"$Z_DATE\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_label=\".*\"/iso_label=\"ZUCC_$Z_DATE\"/g" custom-profile/profiledef.sh
          
          # 2.1. Update bootloader configs for CachyOS kernel
          # Standard Archiso releng profile uses 'vmlinuz-linux' and 'initramfs-linux.img'
          # We swap them to 'vmlinuz-linux-cachyos' and 'initramfs-linux-cachyos.img'
          find custom-profile -type f -name "*.conf" -exec sed -i 's/vmlinuz-linux/vmlinuz-linux-cachyos/g' {} +
          find custom-profile -type f -name "*.conf" -exec sed -i 's/initramfs-linux.img/initramfs-linux-cachyos.img/g' {} +
          find custom-profile -type f -name "*.cfg" -exec sed -i 's/vmlinuz-linux/vmlinuz-linux-cachyos/g' {} +
          find custom-profile -type f -name "*.cfg" -exec sed -i 's/initramfs-linux.img/initramfs-linux-cachyos.img/g' {} +
          
          # 3. Append your custom shopping list
          cat packages.x86_64 >> custom-profile/packages.x86_64
          
          # 4. Use your custom pacman.conf
          cp pacman.conf custom-profile/pacman.conf
          
          # 5. Copy airootfs files (temporarily move conflicting files)
          mkdir -p airootfs_backup
          mv airootfs/etc/calamares/modules/unpackfs.conf airootfs_backup/ 2>/dev/null || true
          cp -r airootfs/* custom-profile/airootfs/ 2>/dev/null || true
          
          # 6. Enable LightDM, NetworkManager, and Liveuser Setup
          mkdir -p custom-profile/airootfs/etc/systemd/system/multi-user.target.wants
          mkdir -p custom-profile/airootfs/etc/systemd/system/display-manager.service.d
          ln -sf /usr/lib/systemd/system/lightdm.service custom-profile/airootfs/etc/systemd/system/display-manager.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service custom-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          ln -sf /etc/systemd/system/liveuser-setup.service custom-profile/airootfs/etc/systemd/system/multi-user.target.wants/liveuser-setup.service

      - name: Build ISO natively
        run: |
          # 7. Restore conflicting files AFTER package installation but BEFORE ISO build
          mkdir -p airootfs_backup
          mkdir -p out
          
          # Capture build logs to a file
          echo "Starting build at $(date)" > build.log
          mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log || {
            echo "Build failed, attempting to overwrite conflicting files..." | tee -a build.log
            cp airootfs_backup/unpackfs.conf work/x86_64/airootfs/etc/calamares/modules/unpackfs.conf
            mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log
          }

      - name: Upload ISO and Logs
        uses: actions/upload-artifact@v4
        with:
          name: zuccos-build-assets
          path: |
            out/*.iso
            build.log

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.Z_DATE }}-${{ github.run_number }}
          name: ZuccOS Build ${{ env.Z_DATE }} (Run ${{ github.run_number }})
          make_latest: true
          files: |
            out/*.iso
            build.log
          body: |
            ### ⚠️ Rolling Release Warning
            This is an automated build of **ZuccOS**. 
            - **Status**: Unchecked / Experimental
            - **Version**: ${{ env.Z_DATE }}
            - **Build ID**: ${{ github.run_number }}
            
            Please check the build logs included in this release before installing.
            
            Built on: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build ISO

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: 
      image: archlinux:latest
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # 1. Initialize and populate Arch keys
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring archiso wget git
          
          # 2. Setup Chaotic-AUR (Used for yay and other tools)
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'

          # 3. Create a CLEAN pacman.conf for the BUILDER
          # Arch is on TOP to ensure the builder uses v1/v2 binaries (No ISA crash)
          # CachyOS is at the BOTTOM to provide the Kernel and Calamares
          cat << 'EOF' > /etc/pacman.conf
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          SigLevel = Never

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [cachyos]
          SigLevel = Never
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos

          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOF

          # 4. Sync everything
          pacman -Syy

          # 5. Install the dependencies WITHOUT the repo prefix
          # Pacman will grab these from [extra] automatically
          pacman -S --noconfirm yaml-cpp boost-libs

      - name: Prepare Custom Profile
        run: |
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # 1. Clean Package List
          sed -i '/base-devel/d' packages.x86_64
          cp packages.x86_64 custom-profile/packages.x86_64
          
          # 2. ISO Naming & Compression
          sed -i 's/airootfs_compression="zstd"/airootfs_compression=("xz" "-Xbcj" "x86" "-9" "--extreme")/g' custom-profile/profiledef.sh
          Z_DATE=$(date +%y%m%d)
          echo "Z_DATE=$Z_DATE" >> $GITHUB_ENV
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"zuccos\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_version=\".*\"/iso_version=\"$Z_DATE\"/g" custom-profile/profiledef.sh

          # 3. THE PRESET: Force mkinitcpio to use our specific naming
          mkdir -p custom-profile/airootfs/etc/mkinitcpio.d/
          echo 'PRESETS=("main")
          main_config="/etc/mkinitcpio.conf"
          main_image="/boot/initramfs-linux.img"
          main_kver="/boot/vmlinuz-linux-cachyos-rt-bore"' > custom-profile/airootfs/etc/mkinitcpio.d/linux.preset

          # 4. THE BOOTLOADER FIX: Update BOTH BIOS (.cfg) and UEFI (.conf)
          # We swap the kernel name and ensure the initrd is correct
          find custom-profile -type f \( -name "*.cfg" -o -name "*.conf" \) -exec sed -i 's/vmlinuz-linux/vmlinuz-linux-cachyos-rt-bore/g' {} +
          # Force any reference to initramfs-linux-cachyos back to the standard name we set in the preset
          find custom-profile -type f \( -name "*.cfg" -o -name "*.conf" \) -exec sed -i 's/initramfs-linux-cachyos-rt-bore.img/initramfs-linux.img/g' {} +

          # 5. Autologin
          mkdir -p custom-profile/airootfs/etc/systemd/system/getty@tty1.service.d/
          echo -e "[Service]\nExecStart=\nExecStart=-/usr/bin/agetty --autologin root --noclear %I \$TERM" > custom-profile/airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf

          # 6. Final Sync
          cp pacman.conf custom-profile/pacman.conf
          cp -r airootfs/* custom-profile/airootfs/ 2>/dev/null || true

          # 7. Force the correct HOOKS for Archiso
          # This ensures the initramfs knows it is booting from an ISO
          sed -i 's/^HOOKS=.*/HOOKS=(base udev memdisk archiso_loop_mnt archiso archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms block filesystems keyboard)/' custom-profile/airootfs/etc/mkinitcpio.conf

      - name: Build ISO natively
        run: |
          mkdir -p out
          echo "Starting build at $(date)" > build.log

          # 1. First Pass: Remove conflicts so pacman can install the calamares package
          rm -f custom-profile/airootfs/etc/calamares/modules/unpackfs.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/welcome.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/bootloader.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/packages.conf

          # 2. Start the build (Pacman will install its default files now)
          # We use the -w (work) directory to our advantage
          mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log || {
            echo "First pass failed as expected, or reached a check. Re-applying custom files..."
          }

          # 3. Second Pass: Overwrite the package's defaults with YOUR local files
          # This copies your repo files directly into the 'work' directory where the ISO is being built
          cp -rf airootfs/* work/x86_64/airootfs/ 2>/dev/null || true

          # 4. Final Run: Run mkarchiso again. It will see the files are already there and 
          # just finish the compression using YOUR versions.
          mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log

          # Get the size of the ISO and save it to GITHUB_ENV for the release body
          ISO_SIZE_HUMAN=$(du -h out/*.iso | cut -f1)
          echo "ISO_SIZE=$ISO_SIZE_HUMAN" >> $GITHUB_ENV

      - name: Upload Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuccOS-ISO-${{ env.Z_DATE }}
          path: |
            out/*.iso
            build.log
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.Z_DATE }}-${{ github.run_number }}
          name: ZuccOS Build ${{ env.Z_DATE }} (Run ${{ github.run_number }})
          make_latest: true
          files: build.log
          body: |
            ### 📥 Download ZuccOS
            GitHub Release direct upload failed because the ISO is **${{ env.ISO_SIZE }}** (Limit is 2GB).
            
            **Please download the ISO from the link below:**
            👉 **[Download from GitHub Actions Mirror](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**
            
            *(Scroll to the bottom of the page to find the **zuccos-build-assets** download)*
            
            ---
            **Build Details:**
            - **Kernel:** `linux-cachyos-rt-bore`
            - **Version:** ${{ env.Z_DATE }}
            - **Compression:** XZ Extreme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
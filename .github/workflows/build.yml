name: Build ZuccOS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          
          # Setup Chaotic-AUR for the builder environment
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'

          # Configure builder pacman.conf (Arch first for stability)
          cat << 'EOF' > /etc/pacman.conf
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          SigLevel = Never
          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [cachyos]
          SigLevel = Never
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOF

          pacman -Syy
          pacman -S --noconfirm archiso wget git yaml-cpp boost-libs

      - name: Prepare Custom Profile
        run: |
          # 1. Copy base template
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # 2. Fix the Package List
          sed -i '/base-devel/d' packages.x86_64
          cp packages.x86_64 custom-profile/packages.x86_64

          # 3. Pacman.conf Setup (THE KEY FIX)
          # We tell pacman NOT to install the default Calamares configs 
          # so your local ones can exist without conflict errors.
          cp pacman.conf custom-profile/pacman.conf
          sed -i 's/SigLevel = .*/SigLevel = Never/g' custom-profile/pacman.conf
          sed -i '/\[options\]/a NoExtract = etc/calamares/modules/*' custom-profile/pacman.conf

          # 4. Create the mkinitcpio.conf with ARCHISO hooks
          mkdir -p custom-profile/airootfs/etc/
          echo 'HOOKS=(base udev memdisk archiso_loop_mnt archiso archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms block filesystems keyboard)' > custom-profile/airootfs/etc/mkinitcpio.conf

          # 5. ISO Naming & Compression
          Z_DATE=$(date +%y%m%d)
          echo "Z_DATE=$Z_DATE" >> $GITHUB_ENV
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"zuccos\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_version=\".*\"/iso_version=\"$Z_DATE\"/g" custom-profile/profiledef.sh
          sed -i 's/airootfs_compression="zstd"/airootfs_compression=("xz" "-Xbcj" "x86" "-9" "--extreme")/g' custom-profile/profiledef.sh

          # 6. Kernel Preset & Bootloader logic
          mkdir -p custom-profile/airootfs/etc/mkinitcpio.d/
          echo 'PRESETS=("main")
          main_config="/etc/mkinitcpio.conf"
          main_image="/boot/initramfs-linux.img"
          main_kver="/boot/vmlinuz-linux-cachyos-rt-bore"' > custom-profile/airootfs/etc/mkinitcpio.d/linux.preset
          find custom-profile -type f \( -name "*.cfg" -o -name "*.conf" \) -exec sed -i 's/vmlinuz-linux/vmlinuz-linux-cachyos-rt-bore/g' {} +
          find custom-profile -type f \( -name "*.cfg" -o -name "*.conf" \) -exec sed -i 's/initramfs-linux-cachyos-rt-bore.img/initramfs-linux.img/g' {} +

          # 7. Final Sync: Copy YOUR repo files into the profile
          cp -r airootfs/* custom-profile/airootfs/ 2>/dev/null || true

          # 8. THE OVERRIDE: Unlock root & Autologin
          sed -i 's/^root:[^:]*:/root::/' custom-profile/airootfs/etc/shadow
          mkdir -p custom-profile/airootfs/etc/systemd/system/getty@tty1.service.d/
          echo -e "[Service]\nExecStart=\nExecStart=-/usr/bin/agetty --autologin root --noclear %I \$TERM" > custom-profile/airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf

      - name: Build ISO
        run: |
          mkdir -p out
          mkarchiso -v -w work -o out custom-profile/

      - name: Rename ISO for Easy Release
        run: |
          mv out/*.iso out/zuccos-latest.iso

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.Z_DATE }}
          name: ZuccOS Build ${{ env.Z_DATE }}
          files: out/zuccos-latest.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
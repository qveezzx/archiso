name: Build ISO

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: archlinux:latest
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm archiso

      - name: Prepare Custom Profile
        run: |
          # 1. Copy the official Arch 'releng' profile to a new folder
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # 2. Change the name of the ISO from 'archlinux' to your custom name
          sed -i 's/iso_name="archlinux"/iso_name="my-custom-arch"/g' custom-profile/profiledef.sh
          
          # 3. Append your custom shopping list to the official package list
          cat packages.x86_64 >> custom-profile/packages.x86_64
          
          # 4. Use your Rackspace pacman.conf to prevent 404 errors
          cp pacman.conf custom-profile/pacman.conf
          
          # 5. Copy any custom files you made (like os-release) into the profile
          cp -r airootfs/* custom-profile/airootfs/ 2>/dev/null || true
          
          # 6. Enable SDDM (KDE Auto-Login) and NetworkManager
          mkdir -p custom-profile/airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/sddm.service custom-profile/airootfs/etc/systemd/system/display-manager.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service custom-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service

      - name: Build ISO
        uses: coderadu/actions-mkarchiso@v1
        with:
          # Tell the builder to use our newly patched folder
          build-dir: 'custom-profile'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-iso
          path: out/*.iso
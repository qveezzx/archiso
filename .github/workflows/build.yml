name: Build ZuccOS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          
          # Setup Chaotic-AUR Keys
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'

          # Force a clean builder pacman.conf
          cat << 'EOF' > /etc/pacman.conf
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          SigLevel = Never
          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [cachyos]
          SigLevel = Never
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOF

          pacman -Syy
          pacman -S --noconfirm archiso wget git yaml-cpp boost-libs

      - name: Prepare and Build ZuccOS
        run: |
          # 1. Setup Base Profile
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # 2. Package List Cleanup
          sed -i '/base-devel/d' packages.x86_64
          cp packages.x86_64 custom-profile/packages.x86_64

          # 3. Create the "Safe House" for your custom files
          # We don't put them in /etc/ yet so Pacman doesn't see them.
          mkdir -p custom-profile/airootfs/opt/zucc-configs
          cp -r airootfs/* custom-profile/airootfs/opt/zucc-configs/

          # 4. Create the Magic Script (customize_airootfs.sh)
          # mkarchiso automatically runs this script INSIDE the ISO after Pacman is done.
          cat << 'EOF' > custom-profile/customize_airootfs.sh
          #!/bin/bash
          # Overwrite the package defaults with your custom files from the safe house
          cp -rf /opt/zucc-configs/* /
          # Clean up the safe house to save ISO space
          rm -rf /opt/zucc-configs
          
          # Unlock root password
          sed -i 's/^root:[^:]*:/root::/' /etc/shadow
          
          # Setup Autologin
          mkdir -p /etc/systemd/system/getty@tty1.service.d/
          echo -e "[Service]\nExecStart=\nExecStart=-/usr/bin/agetty --autologin root --noclear %I \$TERM" > /etc/systemd/system/getty@tty1.service.d/autologin.conf
          EOF
          chmod +x custom-profile/customize_airootfs.sh

          # 5. Fix Pacman Config (Standard Setup)
          cat << 'EOF' > custom-profile/pacman.conf
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          SigLevel = Never
          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [cachyos]
          SigLevel = Never
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOF

          # 6. Kernel & ISO Naming
          Z_DATE=$(date +%y%m%d)
          echo "Z_DATE=$Z_DATE" >> $GITHUB_ENV
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"zuccos\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_version=\".*\"/iso_version=\"$Z_DATE\"/g" custom-profile/profiledef.sh
          sed -i 's/airootfs_compression="zstd"/airootfs_compression=("xz" "-Xbcj" "x86" "-9" "--extreme")/g' custom-profile/profiledef.sh

          # 7. FINAL BUILD
          mkdir -p out
          mkarchiso -v -w work -o out custom-profile/

      - name: Release
        run: |
          mv out/*.iso out/zuccos-latest.iso
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.Z_DATE }}
          name: ZuccOS Build ${{ env.Z_DATE }}
          files: out/zuccos-latest.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
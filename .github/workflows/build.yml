name: Build Arch ISO
on: [push]

jobs:
  archiso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Archiso
        # This is a reliable community action for building Arch
        uses: anton-shulgin/archiso-action@v2
        with:
          iso_name: my-custom-arch
          # We tell the action to use the current directory as the profile
          profile_path: .

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-ISO
          path: output/*.iso
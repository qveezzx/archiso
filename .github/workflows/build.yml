name: Build ISO

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: 
      image: archlinux:latest
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm wget
          
          # Setup Chaotic-AUR & CachyOS Repos
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          
          echo -e "\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist" >> /etc/pacman.conf
          echo -e "\n[cachyos]\nSigLevel = Never\nServer = https://mirror.cachyos.org/repo/\$arch/\$repo" >> /etc/pacman.conf
          
          pacman -Syu --noconfirm archiso

      - name: Prepare Custom Profile
        run: |
          cp -r /usr/share/archiso/configs/releng custom-profile
          
          # FORCE EXTREME COMPRESSION TO STAY UNDER LIMIT
          sed -i 's/airootfs_compression="zstd"/airootfs_compression=("xz" "-Xbcj" "x86" "-9" "--extreme")/g' custom-profile/profiledef.sh
          
          Z_DATE=$(date +%y%m%d)
          echo "Z_DATE=$Z_DATE" >> $GITHUB_ENV
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"zuccos\"/g" custom-profile/profiledef.sh
          sed -i "s/iso_version=\".*\"/iso_version=\"$Z_DATE\"/g" custom-profile/profiledef.sh
          
          # Kernel Swaps
          find custom-profile -type f -name "*.conf" -exec sed -i 's/vmlinuz-linux/vmlinuz-linux-cachyos-rt-bore/g' {} +
          find custom-profile -type f -name "*.conf" -exec sed -i 's/initramfs-linux.img/initramfs-linux-cachyos-rt-bore.img/g' {} +

          # Force mkinitcpio to use the CachyOS RT-BORE kernel preset
          # This prevents the "vmlinuz-linux not found" error
          sed -i 's/ALL_kver=(.*/ALL_kver=( \/boot\/vmlinuz-linux-cachyos-rt-bore )/g' custom-profile/airootfs/etc/mkinitcpio.d/linux.preset
          
          # Also ensure the output image name matches what the bootloader expects
          sed -i 's/archiso_image=(.*/archiso_image=( \/boot\/initramfs-linux-cachyos-rt-bore.img )/g' custom-profile/airootfs/etc/mkinitcpio.d/linux.preset
          
          # Size optimization: Remove base-devel from packages.x86_64 if it exists to save ~250MB
          sed -i '/base-devel/d' packages.x86_64
          cat packages.x86_64 >> custom-profile/packages.x86_64
          cp pacman.conf custom-profile/pacman.conf
          cp -r airootfs/* custom-profile/airootfs/ 2>/dev/null || true

      - name: Build ISO natively
        run: |
          mkdir -p out
          echo "Starting build at $(date)" > build.log

          # 1. First Pass: Remove conflicts so pacman can install the calamares package
          rm -f custom-profile/airootfs/etc/calamares/modules/unpackfs.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/welcome.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/bootloader.conf
          rm -f custom-profile/airootfs/etc/calamares/modules/packages.conf

          # 2. Start the build (Pacman will install its default files now)
          # We use the -w (work) directory to our advantage
          mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log || {
            echo "First pass failed as expected, or reached a check. Re-applying custom files..."
          }

          # 3. Second Pass: Overwrite the package's defaults with YOUR local files
          # This copies your repo files directly into the 'work' directory where the ISO is being built
          cp -rf airootfs/* work/x86_64/airootfs/ 2>/dev/null || true

          # 4. Final Run: Run mkarchiso again. It will see the files are already there and 
          # just finish the compression using YOUR versions.
          mkarchiso -v -w work -o out custom-profile 2>&1 | tee -a build.log

      - name: Upload Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuccOS-ISO-${{ env.Z_DATE }}
          path: |
            out/*.iso
            build.log
          retention-days: 90

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.Z_DATE }}-${{ github.run_number }}
          name: ZuccOS Build ${{ env.Z_DATE }} (Run ${{ github.run_number }})
          make_latest: true
          # We only include build.log here initially to ensure the release is created
          files: build.log
          body: |
            ### ⚠️ ISO Download Notice
            The ISO for this build is currently available via the **GitHub Actions Artifacts** link below.
            
            **[⬇️ Download ZuccOS ISO + Logs](${{ env.ARTIFACT_URL }})**
            
            *Note: If the direct ISO attachment is missing, it exceeded GitHub's 2GB release limit. Use the link above.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt ISO Upload to Release
        # This step tries to upload the ISO, but continues even if it fails
        continue-on-error: true
        run: |
          gh release upload v${{ env.Z_DATE }}-${{ github.run_number }} out/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}